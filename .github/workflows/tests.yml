name: Prototype tests
on:
  pull_request:
  push:
    branches: [main, feature/customer-companion-expansion, fix/blank-homepage-runtime]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check app.js
      - run: node --test *.test.cjs
